# Control 4.9 (support): which features were staged comes only from forensic-provision
# (airlock_profile_features), which first checks ASSETS/profile.json against a fixed schema:
# real booleans, known AI tiers, unknown keys dropped, and any template text refused. The role
# never reads profile.json itself: ASSETS is writable from any computer and profile.json is
# not signed, so its text must never reach Ansible's templating. Only a real true turns
# Autopsy on.
# Test: tests/unit/test_tools_autopsy.py (install steps gated on the autopsy feature; the role
# never reads profile.json); tests/unit/test_provision.py (templated profile values refused).
- name: Profile | Take the staged features from forensic-provision (4.9)
  ansible.builtin.set_fact:
    tools_autopsy_staged:
      autopsy: "{{ (tools_autopsy_features.autopsy | default(false)) is sameas true }}"
