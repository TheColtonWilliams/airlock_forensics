# Control 4.9: the Autopsy zip staged on ASSETS, checked against its pinned SHA-256, unpacked to
# /opt/autopsy-<version>, and prepared with the zip's own unix_setup.sh (-j Java 17 home).
# Autopsy starts its own Solr 8 search server (standalone, no ZooKeeper) while a case is open.
# Solr 8 listens on every interface unless told otherwise, so its settings file in the zip
# (autopsy-solr.in.sh) is made to bind it to 127.0.0.1; the launcher sets the same (launcher.yml).
# Test: tests/goss/tools.yaml (autopsy-installed: bin/autopsy present and executable when
# Autopsy is installed); tests/unit/test_tools_autopsy.py (pin checked before unpacking; the
# search server is bound to loopback, and provisioning stops when the settings file is absent).
- name: Autopsy | Refuse an unpinned zip (4.9)
  ansible.builtin.assert:
    that:
      - pins[tools_autopsy_zip_pin].sha256 is not none
      - pins[tools_autopsy_zip_pin].sha256 | length == 64
    fail_msg: "pins.{{ tools_autopsy_zip_pin }}.sha256 is null. Pin it and restage the drive."
    quiet: true
  when: &tools_autopsy_zip_when
    - airlock_phase == 'provision'
    - tools_autopsy_staged.autopsy | default(false) | bool

- name: Autopsy | Hash the staged zip (4.9)
  ansible.builtin.stat:
    path: "{{ airlock_assets_files }}/{{ pins[tools_autopsy_zip_pin].target }}"
    checksum_algorithm: sha256
    get_checksum: true
  register: tools_autopsy_zip
  when: *tools_autopsy_zip_when

- name: Autopsy | Check the zip is staged and unchanged (4.9)
  ansible.builtin.assert:
    that:
      - tools_autopsy_zip.stat.exists
      - tools_autopsy_zip.stat.checksum == pins[tools_autopsy_zip_pin].sha256
    fail_msg: >-
      {{ pins[tools_autopsy_zip_pin].target }} is missing from ASSETS or does not match its
      pinned hash. Restage the drive with fetch-assets.
    quiet: true
  when: *tools_autopsy_zip_when

- name: Autopsy | Unpack the checked zip (4.9)
  ansible.builtin.unarchive:
    src: "{{ airlock_assets_files }}/{{ pins[tools_autopsy_zip_pin].target }}"
    dest: "{{ tools_autopsy_install_root }}"
    remote_src: true
    owner: root
    group: root
    creates: "{{ tools_autopsy_prefix }}/unix_setup.sh"
  when: *tools_autopsy_zip_when

- name: Autopsy | Run Autopsy's unix_setup.sh with Java 17 (4.9)
  ansible.builtin.command:
    argv: [bash, "{{ tools_autopsy_prefix }}/unix_setup.sh", -j, "{{ tools_autopsy_java_home }}"]
    chdir: "{{ tools_autopsy_prefix }}"
    creates: "{{ tools_autopsy_prefix }}/autopsy/modules/ext/sleuthkit-{{ tools_autopsy_tsk_version }}.jar.airlock-setup"
  environment:
    JAVA_HOME: "{{ tools_autopsy_java_home }}"
  register: tools_autopsy_setup
  when: *tools_autopsy_zip_when

- name: Autopsy | Find the search server settings files in the zip (4.9)
  ansible.builtin.find:
    paths: "{{ tools_autopsy_prefix }}"
    patterns: "{{ tools_autopsy_solr_include_names }}"
    recurse: true
  register: tools_autopsy_solr_in
  when: *tools_autopsy_zip_when

- name: Autopsy | Stop if Autopsy's search server settings file is missing (4.9)
  ansible.builtin.assert:
    that:
      - >-
        tools_autopsy_solr_in.files | map(attribute='path') | map('basename')
        | select('equalto', tools_autopsy_solr_include_names[0]) | list | length > 0
    fail_msg: >-
      {{ tools_autopsy_solr_include_names[0] }} was not found under {{ tools_autopsy_prefix }},
      so its search server could not be bound to this computer only. Autopsy is not set up.
    quiet: true
  when: *tools_autopsy_zip_when

- name: Autopsy | Bind the search server to this computer only (4.9)
  ansible.builtin.blockinfile:
    path: "{{ item.path }}"
    marker: "# {mark} AIRLOCK: search server on 127.0.0.1 only (4.9)"
    block: "{{ tools_autopsy_solr_bind }}"
    insertafter: EOF
  loop: "{{ tools_autopsy_solr_in.files }}"
  loop_control:
    label: "{{ item.path }}"
  when: *tools_autopsy_zip_when

- name: Autopsy | Mark the setup as done (4.9)
  ansible.builtin.copy:
    dest: "{{ tools_autopsy_prefix }}/autopsy/modules/ext/sleuthkit-{{ tools_autopsy_tsk_version }}.jar.airlock-setup"
    content: "unix_setup.sh -j {{ tools_autopsy_java_home }}\n"
    owner: root
    group: root
    mode: "0644"
  when:
    - airlock_phase == 'provision'
    - tools_autopsy_staged.autopsy | default(false) | bool
    - tools_autopsy_setup is changed
