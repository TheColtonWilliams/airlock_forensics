# tools_autopsy: one control per file. Each file names its test in its first comment.
# Controls and tests are listed in docs/controls.md (section "Forensic tools").
- name: Autopsy | Java 17 and libraries (image)
  ansible.builtin.import_tasks: java.yml

- name: Autopsy | Staged features from the profile
  ansible.builtin.import_tasks: profile_features.yml

- name: Autopsy | Sleuth Kit Java package from ASSETS
  ansible.builtin.import_tasks: sleuthkit_java.yml

- name: Autopsy | Autopsy from ASSETS
  ansible.builtin.import_tasks: autopsy.yml

- name: Autopsy | Launcher
  ansible.builtin.import_tasks: launcher.yml
