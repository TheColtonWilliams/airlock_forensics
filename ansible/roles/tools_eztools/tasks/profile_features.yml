# Control 4.4 (support): which features were staged comes only from forensic-provision
# (airlock_profile_features), which first checks ASSETS/profile.json against a fixed schema:
# real booleans, known AI tiers, unknown keys dropped, and any template text refused. The role
# never reads profile.json itself: ASSETS is writable from any computer and profile.json is
# not signed, so its text must never reach Ansible's templating. Only a real true turns EZ
# Tools on.
# Test: tests/unit/test_tools_eztools.py (feature gating of the unpack step; the role never
# reads profile.json); tests/unit/test_offline_phase.py (no role reads profile.json).
- name: Profile | Take the staged features from forensic-provision (4.4)
  ansible.builtin.set_fact:
    tools_eztools_staged:
      eztools: "{{ (tools_eztools_features.eztools | default(false)) is sameas true }}"
