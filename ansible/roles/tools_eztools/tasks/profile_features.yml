# Control 4.4 (support): when provisioning, read which features were staged
# (ASSETS/profile.json, contract section 6) unless forensic-provision passed them.
# Test: tests/unit/test_tools_eztools.py (feature gating of the unpack step).
- name: Profile | Look for profile.json on ASSETS (4.4)
  ansible.builtin.stat:
    path: "{{ airlock_assets_mount }}/profile.json"
  register: tools_eztools_profile_stat
  when: airlock_phase == 'provision'

- name: Profile | Read profile.json (4.4)
  ansible.builtin.slurp:
    src: "{{ airlock_assets_mount }}/profile.json"
  register: tools_eztools_profile_raw
  when:
    - airlock_phase == 'provision'
    - tools_eztools_features | length == 0
    - tools_eztools_profile_stat.stat.exists | default(false)

- name: Profile | Set the staged features (4.4)
  ansible.builtin.set_fact:
    tools_eztools_staged: >-
      {{ tools_eztools_features if tools_eztools_features | length > 0 else
         ((tools_eztools_profile_raw.content | b64decode | from_json).features
          if tools_eztools_profile_raw.content is defined else {}) }}
