- name: Base update initramfs
  ansible.builtin.command:
    argv: [update-initramfs, -u, -k, all]
  changed_when: true

- name: Base update grub
  ansible.builtin.command:
    argv: [update-grub]
  changed_when: true

- name: Base dconf update
  ansible.builtin.command:
    argv: [dconf, update]
  changed_when: true

- name: Base systemd reload
  ansible.builtin.systemd_service:
    daemon_reload: true
