# Control 1.2: no screen lock (there is no password to unlock it), no screen blanking
# lock, and no automatic suspend in the middle of a long analysis. The keys are locked
# so the desktop settings cannot change them.
# Test: tests/goss/base.yaml (screen-lock-off).

- name: Make the dconf folders (1.2)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/dconf/profile
    - /etc/dconf/db/local.d/locks

- name: Use the system dconf database (1.2)
  ansible.builtin.copy:
    content: |
      user-db:user
      system-db:local
    dest: /etc/dconf/profile/user
    owner: root
    group: root
    mode: "0644"
  notify: Base dconf update

- name: Turn the screen lock off (1.2)
  ansible.builtin.copy:
    src: dconf-10-airlock-session
    dest: /etc/dconf/db/local.d/10-airlock-session
    owner: root
    group: root
    mode: "0644"
  notify: Base dconf update

- name: Lock the screen-lock keys (1.2)
  ansible.builtin.copy:
    src: dconf-10-airlock-session.locks
    dest: /etc/dconf/db/local.d/locks/10-airlock-session
    owner: root
    group: root
    mode: "0644"
  notify: Base dconf update
