# Control 1.2: passwordless sudo for the analyst (there is no password to type).
# Test: tests/goss/base.yaml (analyst-sudo).

- name: Give the analyst passwordless sudo (1.2)
  ansible.builtin.copy:
    content: |
      # Managed by the AIRLOCK base role (task 1.2). The analyst has no password.
      {{ airlock_user }} ALL=(ALL:ALL) NOPASSWD: ALL
    dest: /etc/sudoers.d/90-airlock-analyst
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
