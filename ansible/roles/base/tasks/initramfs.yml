# Controls 1.3 and 1.12: the initramfs carries most modules (MODULES=most) plus the USB,
# UAS, NVMe, Intel VMD and SATA drivers by name, so the drive finds its own root
# filesystem on hardware other than the build VM.
# Test: tests/goss/base.yaml (initramfs-modules).

- name: Keep most modules in the initramfs (1.3)
  ansible.builtin.copy:
    content: "MODULES=most\n"
    dest: /etc/initramfs-tools/conf.d/airlock-modules.conf
    owner: root
    group: root
    mode: "0644"
  notify: Base update initramfs

- name: Always include the boot storage drivers (1.12)
  ansible.builtin.blockinfile:
    path: /etc/initramfs-tools/modules
    marker: "# {mark} AIRLOCK boot storage drivers (base role, task 1.12)"
    block: "{{ base_initramfs_modules | join('\n') }}"
    create: true
    owner: root
    group: root
    mode: "0644"
  notify: Base update initramfs
