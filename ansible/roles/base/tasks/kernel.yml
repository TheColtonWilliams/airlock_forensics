# Controls 1.3 and 1.12: the generic-flavour HWE kernel, so the drive boots real PCs and
# not only the build VM. Virtual-flavour kernels lack those drivers and are removed.
# Test: tests/goss/base.yaml (kernel-generic).

- name: Install the generic HWE kernel (1.3, 1.12)
  ansible.builtin.apt:
    name: "{{ base_kernel_package }}"
    state: present

- name: Remove virtual-flavour kernels (1.3)
  ansible.builtin.apt:
    name: "{{ base_unwanted_kernel_packages }}"
    state: absent
    purge: true
