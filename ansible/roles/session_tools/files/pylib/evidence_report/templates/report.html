<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'none'; media-src 'none'; script-src 'none'; connect-src 'none'; font-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="AIRLOCK evidence-report $version">
<title>$title</title>
<style>
:root { --ink: #1b1f23; --muted: #57606a; --line: #d0d7de; --warn-bg: #fff4ce; --warn-line: #bf8700; --ai-bg: #f1f6ff; --ai-line: #2f6fdb; --bg: #ffffff; }
html { background: var(--bg); }
body { font-family: system-ui, "Segoe UI", Arial, sans-serif; color: var(--ink); max-width: 60rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; background: var(--bg); }
h1 { font-size: 1.6rem; margin-bottom: 0.2rem; }
h2 { font-size: 1.25rem; border-bottom: 1px solid var(--line); padding-bottom: 0.2rem; margin-top: 2.2rem; }
h3 { font-size: 1.05rem; margin-top: 1.4rem; }
table { border-collapse: collapse; width: 100%; margin: 0.6rem 0 1rem; font-size: 0.92rem; }
th, td { border: 1px solid var(--line); padding: 0.3rem 0.5rem; text-align: left; vertical-align: top; overflow-wrap: anywhere; }
th { background: #f6f8fa; }
code, .mono { font-family: ui-monospace, Consolas, "Courier New", monospace; font-size: 0.9em; overflow-wrap: anywhere; }
.notice { border-left: 4px solid var(--warn-line); background: var(--warn-bg); padding: 0.6rem 0.9rem; margin: 1rem 0; }
.ai { border-left: 4px solid var(--ai-line); background: var(--ai-bg); padding: 0.6rem 0.9rem; margin: 0.8rem 0; }
.ai .label { font-weight: 600; }
.ai .prov { color: var(--muted); font-size: 0.85rem; overflow-wrap: anywhere; }
.review { font-weight: 600; margin-top: 0.5rem; }
.muted { color: var(--muted); }
.limits li { margin-bottom: 0.3rem; }
@media print { body { margin: 0; max-width: none; } .ai, .notice { break-inside: avoid; } }
</style>
</head>
<body>
$body
</body>
</html>
