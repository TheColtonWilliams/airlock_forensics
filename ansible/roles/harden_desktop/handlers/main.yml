- name: Harden desktop | Update dconf database
  ansible.builtin.command: dconf update
  changed_when: true

- name: Harden desktop | Refresh the desktop and mailcap databases
  ansible.builtin.command:
    argv: "{{ item }}"
    removes: "{{ item[0] }}"
  loop:
    - ["{{ harden_desktop_update_desktop_database }}", --quiet, "{{ harden_desktop_applications_dirs[0] }}"]
    - ["{{ harden_desktop_update_desktop_database }}", --quiet, "{{ harden_desktop_applications_dirs[1] }}"]
    - ["{{ harden_desktop_update_mime }}"]
  changed_when: true
