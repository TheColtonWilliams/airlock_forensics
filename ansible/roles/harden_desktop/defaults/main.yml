# harden_desktop: no thumbnails, previews, indexers, volume monitors, or screen lock.
# Every unit listed under *_masked_user_units must have a goss check in tests/goss/desktop.yaml;
# tests/unit/test_harden_coverage.py fails if one is missing.

# Task 5.1: packages whose only job is making thumbnails or previews of files.
# Thumbnailers shipped inside packages that must stay (librsvg2-common for gdm3, heif and webp
# loaders for gnome-control-center, evince, totem, gnome-font-viewer) are diverted instead.
harden_desktop_thumbnailer_packages_absent:
  - ffmpegthumbnailer
  - gnome-sushi
  - libgdk-pixbuf2.0-bin
  - libgsf-bin
  - gnome-epub-thumbnailer
  - ooo-thumbnailer
  - tumbler
  - icoextract-thumbnailer
  - gnome-model-thumbnailer
  - gnome-nds-thumbnailer
# Directories the GNOME thumbnail factory reads *.thumbnailer files from.
harden_desktop_thumbnailer_dirs:
  - /usr/share/thumbnailers
  - /usr/local/share/thumbnailers

# Task 5.1: gvfs volume monitors (user units). udisks2 mounts disks; the others mount phones,
# cameras, and online accounts. Their .monitor registration files are diverted too.
harden_desktop_volume_monitor_masked_user_units:
  - gvfs-udisks2-volume-monitor.service
  - gvfs-mtp-volume-monitor.service
  - gvfs-gphoto2-volume-monitor.service
  - gvfs-afc-volume-monitor.service
  - gvfs-goa-volume-monitor.service
harden_desktop_volume_monitor_files:
  - /usr/share/gvfs/remote-volume-monitors/udisks2.monitor
  - /usr/share/gvfs/remote-volume-monitors/mtp.monitor
  - /usr/share/gvfs/remote-volume-monitors/gphoto2.monitor
  - /usr/share/gvfs/remote-volume-monitors/afc.monitor
  - /usr/share/gvfs/remote-volume-monitors/goa.monitor

# Task 5.2: the file indexer. Ubuntu 24.04 (GNOME 46) ships tracker-miners 3.7, whose units are
# tracker-miner-fs-3 and friends; GNOME 47 and later rename them localsearch-3. Both names are masked.
harden_desktop_indexer_masked_user_units:
  - tracker-miner-fs-3.service
  - tracker-miner-fs-control-3.service
  - tracker-writeback-3.service
  - tracker-xdg-portal-3.service
  - localsearch-3.service
  - localsearch-control-3.service
  - localsearch-writeback-3.service
harden_desktop_indexer_autostart_absent:
  - /etc/xdg/autostart/tracker-miner-fs-3.desktop
  - /etc/xdg/autostart/localsearch-3.desktop

# Task 5.1: LibreOffice is installed headless in every image (tools_ai; the documents module runs
# `soffice --headless --convert-to`), but the desktop must never offer to open a file with it:
# a double-click on an evidence Office file in Files would otherwise start it. Its desktop
# entries and mailcap entries (full and -nogui package names) are diverted out of use, hidden
# by Hidden=true overrides, and /etc/xdg/mimeapps.list removes every association with them.
# The packages stay installed.
harden_desktop_libreoffice_disabled_dir: /usr/lib/airlock/libreoffice-disabled
harden_desktop_libreoffice_desktop_ids:
  - libreoffice-startcenter.desktop
  - libreoffice-xsltfilter.desktop
  - libreoffice-writer.desktop
  - libreoffice-calc.desktop
  - libreoffice-impress.desktop
  - libreoffice-draw.desktop
  - libreoffice-math.desktop
  - libreoffice-base.desktop
harden_desktop_libreoffice_desktop_files_absent:
  - /usr/share/applications/libreoffice-startcenter.desktop
  - /usr/share/applications/libreoffice-xsltfilter.desktop
  - /usr/share/applications/libreoffice-writer.desktop
  - /usr/share/applications/libreoffice-calc.desktop
  - /usr/share/applications/libreoffice-impress.desktop
  - /usr/share/applications/libreoffice-draw.desktop
  - /usr/share/applications/libreoffice-math.desktop
  - /usr/share/applications/libreoffice-base.desktop
harden_desktop_libreoffice_mailcap_files_absent:
  - /usr/lib/mime/packages/libreoffice-writer-nogui
  - /usr/lib/mime/packages/libreoffice-calc-nogui
  - /usr/lib/mime/packages/libreoffice-impress-nogui
  - /usr/lib/mime/packages/libreoffice-draw-nogui
  - /usr/lib/mime/packages/libreoffice-writer
  - /usr/lib/mime/packages/libreoffice-calc
  - /usr/lib/mime/packages/libreoffice-impress
  - /usr/lib/mime/packages/libreoffice-draw
# Where desktop entries and mailcap entries are looked for (any other libreoffice* name found
# there is diverted too). Overrides go in the second applications directory.
harden_desktop_applications_dirs:
  - /usr/share/applications
  - /usr/local/share/applications
harden_desktop_mailcap_packages_dir: /usr/lib/mime/packages
harden_desktop_mimeapps_list: /etc/xdg/mimeapps.list
# Rebuild the MIME caches after a change (each runs only when the tool is installed).
harden_desktop_update_desktop_database: /usr/bin/update-desktop-database
harden_desktop_update_mime: /usr/sbin/update-mime
