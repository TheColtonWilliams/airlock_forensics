# Control 4B.5, 4B.7, 4B.15 (support): at first boot, read which features were staged
# (ASSETS/profile.json, contract section 6) unless forensic-provision passed them.
# Test: tests/unit/test_screen_role.py (feature gating).
- name: Profile | Look for profile.json on ASSETS
  ansible.builtin.stat:
    path: "{{ airlock_assets_mount }}/profile.json"
  register: tools_ai_profile_stat
  when: airlock_phase == 'provision'

- name: Profile | Read profile.json
  ansible.builtin.slurp:
    src: "{{ airlock_assets_mount }}/profile.json"
  register: tools_ai_profile_raw
  when:
    - airlock_phase == 'provision'
    - tools_ai_features | length == 0
    - tools_ai_profile_stat.stat.exists | default(false)

- name: Profile | Set the staged features
  ansible.builtin.set_fact:
    tools_ai_staged: >-
      {{ tools_ai_features if tools_ai_features | length > 0 else
         ((tools_ai_profile_raw.content | b64decode | from_json).features
          if tools_ai_profile_raw.content is defined else {}) }}
