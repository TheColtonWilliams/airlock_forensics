# Control 3.7: nftables loads /etc/nftables.conf at boot: policy drop on input, output, and forward, loopback
# accepted (the local AI server listens on 127.0.0.1), and ARP dropped.
# Test: tests/goss/network.yaml (nft list ruleset shows drop policies, nftables enabled); tests/vm/test_airgap.sh
- name: Firewall | Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present

- name: Firewall | Install drop-all ruleset
  ansible.builtin.copy:
    src: nftables.conf
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0755"
    validate: nft -c -f %s
  notify: Harden network | Reload firewall

- name: Firewall | Enable nftables at boot
  ansible.builtin.systemd_service:
    name: nftables.service
    enabled: true

- name: Firewall | Start nftables (first-boot provisioning only; the image build needs SSH)
  ansible.builtin.systemd_service:
    name: nftables.service
    state: started
  when:
    - harden_network_start_firewall | bool
    - not (ansible_facts['is_chroot'] | default(false))
