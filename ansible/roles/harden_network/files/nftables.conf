#!/usr/sbin/nft -f
# AIRLOCK task 3.7: the air gap's second layer. Every packet in, out, or forwarded is dropped,
# except on loopback (the local AI server listens on 127.0.0.1 only). ARP is dropped too.
# There is no toggle: the system never uses a network.
# Test: tests/goss/network.yaml, tests/vm/test_airgap.sh

flush ruleset

table inet airlock {
	chain input {
		type filter hook input priority filter; policy drop;
		iifname "lo" accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy drop;
		oifname "lo" accept
	}
}

table arp airlock_arp {
	chain input {
		type filter hook input priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy drop;
	}
}
