# Release on a version tag (tasks 6.3, 2B.1, 2B.2, 2B.15, 2B.19, 4F.4).
#   preflight   the tag matches airlock_version in main.yml; every pin has a SHA-256
#               (scripts/check-pins.py --strict)
#   image       builds the base image (2B.1: Ubuntu 24.04 desktop, hardening applied, the
#               repository's roles at this tag, forensic-provision, every redistributable tool
#               installed; no EZ Tools, model weights, NSRL, ClamAV or MalwareBazaar data),
#               boot-tests it under UEFI, UEFI + Secure Boot and BIOS, writes the signed asset
#               manifest, the SPDX SBOM of the root filesystem (syft), and the licence record;
#               splits the compressed image into parts under GitHub's per-file limit (2B.2)
#   validation  reruns the validation suite (4F) and builds the signed validation report
#   publish     SHA256SUMS over every file, cosign keyless signature of SHA256SUMS
#               (SHA256SUMS.sig, .pem, .sigstore.json), then the GitHub Release
#
# Needs: secret MANIFEST_SIGNING_KEY (Ed25519 private key PEM, scripts/gen-signing-key.sh) and
# variable MANIFEST_SIGNING_PUBKEY (its public key PEM; baked into the image). Optional
# variable AIRLOCK_LICENCE_REVIEW_DONE=true once task 6.6 is signed off: until then the
# release is created as a draft, because plan 1.12 forbids publishing images before the
# licence review. Optional AIRLOCK_BUILD_RUNS_ON: see build.yml. Process: docs/release-process.md.
# Actions are pinned to commit SHAs (the tag is in the comment), resolved 2026-11-15.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}
  # GitHub's per-file release asset limit is 2 GiB (verify the current limit before each
  # release). Parts are 1900 MiB so every file stays below it.
  PART_MIB: "1900"

jobs:
  preflight:
    name: preflight (tag, pins)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag and the pins
        id: check
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-yaml
          version="$(python3 -c 'import yaml; print(yaml.safe_load(open("ansible/group_vars/all/main.yml"))["airlock_version"])')"
          if [[ "$TAG" != "v$version" ]]; then
            echo "release: tag $TAG does not match airlock_version $version in main.yml. Set airlock_version to ${TAG#v}, commit, and tag again." >&2
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          python3 scripts/check-pins.py --strict
      - name: Check the signing key variable
        env:
          PUBKEY: ${{ vars.MANIFEST_SIGNING_PUBKEY }}
        run: |
          if [[ "$PUBKEY" != *"BEGIN PUBLIC KEY"* ]]; then
            echo "release: repository variable MANIFEST_SIGNING_PUBKEY is not set." \
              "Make the key pair with scripts/gen-signing-key.sh (docs/release-process.md)." >&2
            exit 1
          fi

  image:
    name: build, test, SBOM, manifest (2B.1)
    needs: preflight
    runs-on: ${{ fromJSON(vars.AIRLOCK_BUILD_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 360
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      DIST: ${{ github.workspace }}/dist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Free disk space (hosted runners)
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Check /dev/kvm
        run: |
          if [[ -e /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
              sudo tee /etc/udev/rules.d/99-airlock-ci-kvm.rules >/dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          if [[ -r /dev/kvm && -w /dev/kvm ]]; then
            echo "ACCEL=kvm" >>"$GITHUB_ENV"
          else
            echo "ACCEL=tcg" >>"$GITHUB_ENV"
            echo "::warning::No usable /dev/kvm: emulating with TCG. Release builds belong on a self-hosted KVM runner (AIRLOCK_BUILD_RUNS_ON)."
          fi
      - name: Install build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-yaml openssl
          sudo scripts/prereqs.sh --install --yes --for build
          sudo chown -R "$(id -u):$(id -g)" cache
      - name: Fetch the pinned syft and cosign (pins.yml, SHA-256 checked)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          fetch_pin() {
            python3 - "$1" "$2" <<'PY'
          import hashlib, sys, urllib.request, yaml
          pin, dest = sys.argv[1:3]
          entry = yaml.safe_load(open("ansible/group_vars/all/pins.yml", encoding="utf-8"))["pins"][pin]
          if not entry.get("sha256"):
              sys.exit(f"{pin} is not pinned yet (sha256 null). Fill it in pins.yml first.")
          digest = hashlib.sha256()
          with urllib.request.urlopen(entry["url"], timeout=600) as resp, open(dest, "wb") as out:
              while chunk := resp.read(1 << 20):
                  digest.update(chunk)
                  out.write(chunk)
          if digest.hexdigest() != entry["sha256"]:
              sys.exit(f"{pin}: SHA-256 {digest.hexdigest()} does not match pins.yml. Do not use it.")
          PY
          }
          fetch_pin syft_linux_amd64 "$RUNNER_TEMP/syft.tar.gz"
          tar -xzf "$RUNNER_TEMP/syft.tar.gz" -C "$RUNNER_TEMP/bin" syft
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: Asset manifest, public key and signature (2B.15)
        env:
          MANIFEST_SIGNING_KEY: ${{ secrets.MANIFEST_SIGNING_KEY }}
          PUBKEY: ${{ vars.MANIFEST_SIGNING_PUBKEY }}
        run: |
          printf '%s\n' "$PUBKEY" >assets/manifest-signing.pub.pem
          python3 scripts/gen-manifest.py --release "$TAG" --out assets/manifest.json
          # The key goes to openssl through a pipe; it is never written to disk.
          scripts/sign-manifest.sh --key-env MANIFEST_SIGNING_KEY --pub assets/manifest-signing.pub.pem \
            --manifest assets/manifest.json
          scripts/sign-manifest.sh --verify --pub assets/manifest-signing.pub.pem --manifest assets/manifest.json
      - name: scripts/build.sh
        timeout-minutes: ${{ env.ACCEL == 'kvm' && 150 || 300 }}
        run: scripts/build.sh --accel "$ACCEL" --output "$PWD/output/airlock-$VERSION"
      - name: tests/run-qemu-tests.sh (UEFI, UEFI + Secure Boot, BIOS)
        timeout-minutes: ${{ env.ACCEL == 'kvm' && 120 || 300 }}
        run: |
          sudo tests/run-qemu-tests.sh --image "output/airlock-$VERSION/airlock-$VERSION.raw" \
            --firmware uefi,uefi-sb,bios --require-sig-disk --accel "$ACCEL" \
            --goss "$(scripts/prereqs.sh --goss-path)" --results "$RUNNER_TEMP/qemu-results"
      - name: SBOM of the root filesystem (syft, SPDX JSON) and build-info
        run: |
          mkdir -p "$DIST"
          loop="$(sudo losetup -P -r -f --show "output/airlock-$VERSION/airlock-$VERSION.raw")"
          trap 'sudo umount /mnt/airlock-root 2>/dev/null || true; sudo losetup -d "$loop" || true' EXIT
          sudo mkdir -p /mnt/airlock-root
          sudo mount -o ro,noload "${loop}p5" /mnt/airlock-root
          sudo "$(command -v syft)" scan dir:/mnt/airlock-root --source-name airlock \
            --source-version "$TAG" -o "spdx-json=$DIST/airlock-$TAG.spdx.json"
          sudo chown "$(id -u)" "$DIST/airlock-$TAG.spdx.json"
          sudo cp /mnt/airlock-root/etc/airlock/build-info.json "$DIST/build-info.json"
          sudo chown "$(id -u)" "$DIST/build-info.json"
      - name: Licence record
        run: |
          {
            echo "# AIRLOCK $TAG licence record"
            echo
            echo "Every pinned download, its licence, and where it may live (scripts/check-pins.py --licences-table):"
            echo
            python3 scripts/check-pins.py --licences-table
            echo
            cat docs/licenses.md
          } >"$DIST/airlock-$TAG-licenses.md"
      - name: Split the image for GitHub's per-file limit (2B.2)
        run: |
          src="output/airlock-$VERSION"
          zst="airlock-$VERSION.raw.zst"
          mkdir -p "$DIST"
          if (($(stat -c %s "$src/$zst") > PART_MIB * 1024 * 1024)); then
            split -b "${PART_MIB}M" -d -a 2 "$src/$zst" "$DIST/$zst.part"
            echo "split $zst into $(find "$DIST" -name "$zst.part*" | wc -l) parts of at most $PART_MIB MiB"
          else
            cp "$src/$zst" "$DIST/"
          fi
          # The build's SHA256SUMS lines for the raw image and the whole .zst: users check the
          # reassembled file against them.
          cp "$src/SHA256SUMS" "$DIST/image.sha256"
          cp assets/manifest.json assets/manifest.json.sig assets/manifest-signing.pub.pem "$DIST/"
          cp scripts/fetch-assets.ps1 scripts/fetch-assets.sh scripts/fetch_assets.py "$DIST/"
          ls -l "$DIST"
      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image
          path: ${{ env.DIST }}
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Upload build-info.json (for the validation report)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build-info
          path: ${{ env.DIST }}/build-info.json
          retention-days: 7
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-qemu-results
          path: ${{ runner.temp }}/qemu-results
          retention-days: 30
          if-no-files-found: ignore

  validation:
    name: validation suite and signed report (4F)
    needs: [preflight, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the analysis tools (Ubuntu archive, pinned Dissect)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3-yaml jq openssl zstd faketime bubblewrap sleuthkit ntfs-3g exfatprogs \
            exfat-fuse testdisk libimage-exiftool-perl ffmpeg
          sudo python3 -m venv /opt/dissect
          sudo /opt/dissect/bin/pip install --disable-pip-version-check --require-hashes --no-deps \
            -r ansible/roles/tools_dissect/files/requirements.txt
      - name: Download build-info.json
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build-info
          path: ${{ runner.temp }}/release
      - name: validation/run.sh
        timeout-minutes: 200
        run: |
          sudo env "PATH=/opt/dissect/bin:$PATH" validation/run.sh --build --out "$PWD/validation/out"
          sudo chown -R "$(id -u):$(id -g)" validation/out
      - name: Build and sign the validation report
        env:
          MANIFEST_SIGNING_KEY: ${{ secrets.MANIFEST_SIGNING_KEY }}
          PUBKEY: ${{ vars.MANIFEST_SIGNING_PUBKEY }}
        run: |
          printf '%s\n' "$PUBKEY" >"$RUNNER_TEMP/manifest-signing.pub.pem"
          python3 validation/report/build.py --release "$TAG" --results validation/out \
            --out "$RUNNER_TEMP/validation-report" --build-info "$RUNNER_TEMP/release/build-info.json" \
            --key-env MANIFEST_SIGNING_KEY --pub "$RUNNER_TEMP/manifest-signing.pub.pem" \
            --require-signature
          python3 validation/report/build.py --verify "$RUNNER_TEMP/validation-report" \
            --pub "$RUNNER_TEMP/manifest-signing.pub.pem"
      - name: Upload the validation report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-validation
          path: ${{ runner.temp }}/validation-report
          retention-days: 30
          if-no-files-found: error

  publish:
    name: SHA256SUMS, cosign signature, GitHub Release (6.3)
    needs: [preflight, image, validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # create the release
      id-token: write # cosign keyless signing (Sigstore OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-image
          path: dist
      - name: Download the validation report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-validation
          path: dist
      - name: Fetch the pinned cosign (pins.yml, SHA-256 checked)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-yaml
          python3 - cosign_linux_amd64 "$RUNNER_TEMP/cosign" <<'PY'
          import hashlib, sys, urllib.request, yaml
          pin, dest = sys.argv[1:3]
          entry = yaml.safe_load(open("ansible/group_vars/all/pins.yml", encoding="utf-8"))["pins"][pin]
          if not entry.get("sha256"):
              sys.exit(f"{pin} is not pinned yet (sha256 null). Fill it in pins.yml first.")
          digest = hashlib.sha256()
          with urllib.request.urlopen(entry["url"], timeout=600) as resp, open(dest, "wb") as out:
              while chunk := resp.read(1 << 20):
                  digest.update(chunk)
                  out.write(chunk)
          if digest.hexdigest() != entry["sha256"]:
              sys.exit(f"{pin}: SHA-256 {digest.hexdigest()} does not match pins.yml. Do not use it.")
          PY
          chmod 0755 "$RUNNER_TEMP/cosign"
      - name: SHA256SUMS over every release file
        working-directory: dist
        run: |
          rm -f build-info.json
          image_lines="$(cat image.sha256)"
          rm -f image.sha256
          {
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%f\n' | LC_ALL=C sort |
              xargs -d '\n' sha256sum --
            # The raw image and the whole .zst (before splitting), from the build.
            printf '%s\n' "$image_lines"
          } | LC_ALL=C sort -k2 -u >SHA256SUMS
          cat SHA256SUMS
      - name: cosign keyless signature of SHA256SUMS
        working-directory: dist
        run: |
          "$RUNNER_TEMP/cosign" sign-blob --yes SHA256SUMS \
            --output-signature SHA256SUMS.sig --output-certificate SHA256SUMS.pem \
            --bundle SHA256SUMS.sigstore.json
          "$RUNNER_TEMP/cosign" verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          LICENCE_REVIEW_DONE: ${{ vars.AIRLOCK_LICENCE_REVIEW_DONE }}
        run: |
          {
            echo "AIRLOCK $TAG. Not a write blocker. Not court-validated. Read docs/known-limitations.md."
            echo
            echo "Check and reassemble the image: docs/release-process.md, section \"Checking a release\"."
            echo "Linux: cat airlock-*.raw.zst.part* > airlock-${TAG#v}.raw.zst, then sha256sum -c --ignore-missing SHA256SUMS."
            echo "Windows: see docs/release-process.md for the PowerShell steps."
            echo
            echo "SHA256SUMS is signed with cosign (keyless, this workflow's identity): SHA256SUMS.sig, SHA256SUMS.pem, SHA256SUMS.sigstore.json."
            echo "manifest.json.sig is an Ed25519 signature checked against manifest-signing.pub.pem, which is built into the image."
          } >"$RUNNER_TEMP/notes.md"
          flags=(--verify-tag --title "AIRLOCK $TAG" --notes-file "$RUNNER_TEMP/notes.md")
          [[ "$TAG" == v0.* || "$TAG" == *-* ]] && flags+=(--prerelease)
          if [[ "$LICENCE_REVIEW_DONE" != "true" ]]; then
            echo "::warning::Licence review (task 6.6) not signed off: the release is a draft. Set AIRLOCK_LICENCE_REVIEW_DONE=true after the review."
            flags+=(--draft)
          fi
          gh release create "$TAG" "${flags[@]}" dist/*
