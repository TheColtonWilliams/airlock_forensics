# Issue chooser (task 0.9). Security problems never go in a public issue.
blank_issues_enabled: false
contact_links:
  - name: Report a security problem (private)
    # yamllint disable-line rule:line-length
    url: https://docs.github.com/en/code-security/security-advisories/guidance-on-reporting-and-writing-information-about-vulnerabilities/privately-reporting-a-security-vulnerability
    about: >-
      Use the repository's Security tab, "Report a vulnerability". See SECURITY.md. Never file a
      public issue for it.
