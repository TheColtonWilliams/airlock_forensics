# goss checks for harden_storage (tasks 3.1 to 3.4, 3.8, 3A.1, 3A.2, 3A.4). Run inside the booted
# image by tests/run-qemu-tests.sh, which attaches extra virtual disks (ext4, one with a swap-type
# partition, one with LVM/mdraid/swap signatures). Check syntax with: goss -g tests/goss/storage.yaml render
# Every unit masked by the role has a check here; tests/unit/test_harden_coverage.py enforces it.
