  /etc/systemd/system/udisks2.service:
    title: '3.1: udisks2.service masked'
    exists: true
    filetype: symlink
    linked-to: /dev/null
  /etc/systemd/system/swap.target:
    title: '3.3: swap.target masked'
    exists: true
    filetype: symlink
    linked-to: /dev/null
  /etc/systemd/system/hibernate.target:
