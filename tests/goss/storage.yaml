    exists: true
    filetype: symlink
    linked-to: /dev/null
  /etc/systemd/system/suspend-then-hibernate.target:
    title: '3.3: suspend-then-hibernate.target masked'
    exists: true
    filetype: symlink
    linked-to: /dev/null
  /etc/systemd/system/systemd-hibernate.service:
    title: '3.3: systemd-hibernate.service masked'
    exists: true
    filetype: symlink
    linked-to: /dev/null
  /etc/systemd/system/systemd-hybrid-sleep.service:
    title: '3.3: systemd-hybrid-sleep.service masked'
    exists: true
    filetype: symlink
    linked-to: /dev/null
  /etc/systemd/system/systemd-suspend-then-hibernate.service:
