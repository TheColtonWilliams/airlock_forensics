  snapd:
    title: '5.4: snapd is not installed (snapd_policy=remove)'
    installed: false

command:
  'snapd cannot be installed':
    title: '5.4: apt has no install candidate for snapd'
    exec: apt-cache policy snapd
    exit-status: 0
    stdout:
      - '!/Candidate: [0-9]/'
  'no snap mounts':
    title: '5.4: no snap is mounted'
    exec: "findmnt -rn -o TARGET || true"
    exit-status: 0
    stdout:
      - '!/^\/snap\//'
  'release upgrade prompt off':
    title: '5.3: release upgrade checks are off'
    exec: "test ! -e /etc/update-manager/release-upgrades || grep -Eq '^Prompt=never$' /etc/update-manager/release-upgrades"
    exit-status: 0
  'no update timers':
    title: '5.3: no apt, motd-news, fwupd, Ubuntu Pro, mdcheck, or e2scrub timer is active'
    exec: "systemctl list-timers --no-legend --no-pager || true"
    exit-status: 0
    stdout:
      - '!/apt-daily|motd-news|fwupd-refresh|ua-timer|mdcheck|e2scrub/'
