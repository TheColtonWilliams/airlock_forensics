# goss checks for harden_desktop (tasks 5.1, 5.2, 5.5): no thumbnails, previews, volume monitors,
# indexer, or screen lock. Run inside the booted image by tests/run-qemu-tests.sh.
# Check syntax with: goss -g tests/goss/desktop.yaml render
# Every unit masked by the role has a check here; tests/unit/test_harden_coverage.py enforces it.
file:
  /etc/systemd/user/gvfs-udisks2-volume-monitor.service:
    title: '5.1: user unit gvfs-udisks2-volume-monitor.service masked for every user'
    exists: true
    filetype: symlink
    linked-to: /dev/null
  /etc/systemd/user/gvfs-mtp-volume-monitor.service:
    title: '5.1: user unit gvfs-mtp-volume-monitor.service masked for every user'
    exists: true
    filetype: symlink
    linked-to: /dev/null
  /etc/systemd/user/gvfs-gphoto2-volume-monitor.service:
    title: '5.1: user unit gvfs-gphoto2-volume-monitor.service masked for every user'
    exists: true
    filetype: symlink
    linked-to: /dev/null
  /etc/systemd/user/gvfs-afc-volume-monitor.service:
    title: '5.1: user unit gvfs-afc-volume-monitor.service masked for every user'
    exists: true
    filetype: symlink
    linked-to: /dev/null
  /etc/systemd/user/gvfs-goa-volume-monitor.service:
    title: '5.1: user unit gvfs-goa-volume-monitor.service masked for every user'
    exists: true
    filetype: symlink
    linked-to: /dev/null
  /usr/share/gvfs/remote-volume-monitors/udisks2.monitor:
    title: '5.1: volume monitor registration /usr/share/gvfs/remote-volume-monitors/udisks2.monitor removed'
    exists: false
  /usr/share/gvfs/remote-volume-monitors/mtp.monitor:
    title: '5.1: volume monitor registration /usr/share/gvfs/remote-volume-monitors/mtp.monitor removed'
    exists: false
  /usr/share/gvfs/remote-volume-monitors/gphoto2.monitor:
    title: '5.1: volume monitor registration /usr/share/gvfs/remote-volume-monitors/gphoto2.monitor removed'
    exists: false
  /usr/share/gvfs/remote-volume-monitors/afc.monitor:
    title: '5.1: volume monitor registration /usr/share/gvfs/remote-volume-monitors/afc.monitor removed'
    exists: false
  /usr/share/gvfs/remote-volume-monitors/goa.monitor:
    title: '5.1: volume monitor registration /usr/share/gvfs/remote-volume-monitors/goa.monitor removed'
    exists: false
  /etc/systemd/user/tracker-miner-fs-3.service:
    title: '5.2: user unit tracker-miner-fs-3.service masked for every user'
    exists: true
    filetype: symlink
    linked-to: /dev/null
  /etc/systemd/user/tracker-miner-fs-control-3.service:
    title: '5.2: user unit tracker-miner-fs-control-3.service masked for every user'
    exists: true
    filetype: symlink
    linked-to: /dev/null
  /etc/systemd/user/tracker-writeback-3.service:
    title: '5.2: user unit tracker-writeback-3.service masked for every user'
    exists: true
    filetype: symlink
    linked-to: /dev/null
  /etc/systemd/user/tracker-xdg-portal-3.service:
    title: '5.2: user unit tracker-xdg-portal-3.service masked for every user'
    exists: true
    filetype: symlink
    linked-to: /dev/null
  /etc/systemd/user/localsearch-3.service:
    title: '5.2: user unit localsearch-3.service masked for every user'
    exists: true
    filetype: symlink
    linked-to: /dev/null
  /etc/systemd/user/localsearch-control-3.service:
    title: '5.2: user unit localsearch-control-3.service masked for every user'
    exists: true
    filetype: symlink
    linked-to: /dev/null
  /etc/systemd/user/localsearch-writeback-3.service:
    title: '5.2: user unit localsearch-writeback-3.service masked for every user'
    exists: true
    filetype: symlink
    linked-to: /dev/null
  /etc/xdg/autostart/tracker-miner-fs-3.desktop:
    title: '5.2: indexer autostart /etc/xdg/autostart/tracker-miner-fs-3.desktop removed'
    exists: false
  /etc/xdg/autostart/localsearch-3.desktop:
    title: '5.2: indexer autostart /etc/xdg/autostart/localsearch-3.desktop removed'
    exists: false
  /etc/dconf/db/local:
    title: '5.1: compiled dconf system database exists'
    exists: true
    filetype: file

  /usr/share/applications/libreoffice-startcenter.desktop:
    title: '5.1: LibreOffice desktop entry libreoffice-startcenter.desktop diverted out of use (never offered on the desktop)'
    exists: false
  /usr/share/applications/libreoffice-xsltfilter.desktop:
    title: '5.1: LibreOffice desktop entry libreoffice-xsltfilter.desktop diverted out of use (never offered on the desktop)'
    exists: false
  /usr/share/applications/libreoffice-writer.desktop:
    title: '5.1: LibreOffice desktop entry libreoffice-writer.desktop diverted out of use (never offered on the desktop)'
    exists: false
  /usr/share/applications/libreoffice-calc.desktop:
    title: '5.1: LibreOffice desktop entry libreoffice-calc.desktop diverted out of use (never offered on the desktop)'
    exists: false
  /usr/share/applications/libreoffice-impress.desktop:
    title: '5.1: LibreOffice desktop entry libreoffice-impress.desktop diverted out of use (never offered on the desktop)'
    exists: false
  /usr/share/applications/libreoffice-draw.desktop:
    title: '5.1: LibreOffice desktop entry libreoffice-draw.desktop diverted out of use (never offered on the desktop)'
    exists: false
  /usr/share/applications/libreoffice-math.desktop:
    title: '5.1: LibreOffice desktop entry libreoffice-math.desktop diverted out of use (never offered on the desktop)'
    exists: false
  /usr/share/applications/libreoffice-base.desktop:
    title: '5.1: LibreOffice desktop entry libreoffice-base.desktop diverted out of use (never offered on the desktop)'
    exists: false
  /usr/lib/mime/packages/libreoffice-writer-nogui:
    title: '5.1: LibreOffice mailcap entry libreoffice-writer-nogui diverted out of use'
    exists: false
  /usr/lib/mime/packages/libreoffice-calc-nogui:
    title: '5.1: LibreOffice mailcap entry libreoffice-calc-nogui diverted out of use'
    exists: false
  /usr/lib/mime/packages/libreoffice-impress-nogui:
    title: '5.1: LibreOffice mailcap entry libreoffice-impress-nogui diverted out of use'
    exists: false
  /usr/lib/mime/packages/libreoffice-draw-nogui:
    title: '5.1: LibreOffice mailcap entry libreoffice-draw-nogui diverted out of use'
    exists: false
  /usr/lib/mime/packages/libreoffice-writer:
    title: '5.1: LibreOffice mailcap entry libreoffice-writer diverted out of use'
    exists: false
  /usr/lib/mime/packages/libreoffice-calc:
    title: '5.1: LibreOffice mailcap entry libreoffice-calc diverted out of use'
    exists: false
  /usr/lib/mime/packages/libreoffice-impress:
    title: '5.1: LibreOffice mailcap entry libreoffice-impress diverted out of use'
    exists: false
  /usr/lib/mime/packages/libreoffice-draw:
    title: '5.1: LibreOffice mailcap entry libreoffice-draw diverted out of use'
    exists: false
  /etc/xdg/mimeapps.list:
    title: '5.1: no file type or URL scheme is associated with LibreOffice'
    exists: true
    owner: root
    mode: '0644'
    contents:
      - '/^\[Removed Associations\]$/'
      - '/^application\/vnd\.openxmlformats-officedocument\.wordprocessingml\.document=.*libreoffice-writer\.desktop;/'
      - '/^application\/msword=.*libreoffice-writer\.desktop;/'
      - '/^application\/vnd\.ms-excel=.*libreoffice-calc\.desktop;/'
      - '!/^\[Default Applications\]/'
      - '!/^\[Added Associations\]/'
package:
  ffmpegthumbnailer:
    title: '5.1: package ffmpegthumbnailer not installed'
    installed: false
  gnome-sushi:
    title: '5.1: package gnome-sushi not installed'
    installed: false
  libgdk-pixbuf2.0-bin:
    title: '5.1: package libgdk-pixbuf2.0-bin not installed'
    installed: false
  libgsf-bin:
    title: '5.1: package libgsf-bin not installed'
    installed: false
  gnome-epub-thumbnailer:
    title: '5.1: package gnome-epub-thumbnailer not installed'
    installed: false
  ooo-thumbnailer:
    title: '5.1: package ooo-thumbnailer not installed'
    installed: false
  tumbler:
    title: '5.1: package tumbler not installed'
    installed: false
  icoextract-thumbnailer:
    title: '5.1: package icoextract-thumbnailer not installed'
    installed: false
  gnome-model-thumbnailer:
    title: '5.1: package gnome-model-thumbnailer not installed'
    installed: false
  gnome-nds-thumbnailer:
    title: '5.1: package gnome-nds-thumbnailer not installed'
    installed: false
command:
  'no LibreOffice desktop entry':
    title: '5.1: no LibreOffice desktop entry is left in /usr/share/applications'
    exec: "find /usr/share/applications -name 'libreoffice*.desktop' 2>/dev/null; true"
    exit-status: 0
    stdout:
      - '!/libreoffice/'
  'LibreOffice desktop IDs hidden':
    title: '5.1: every LibreOffice desktop ID has a Hidden=true override in /usr/local/share/applications'
    exec: >-
      set -e; for id in startcenter xsltfilter writer calc impress draw math base; do
      grep -qx 'Hidden=true' "/usr/local/share/applications/libreoffice-$id.desktop"; done; echo hidden
    exit-status: 0
    stdout: ['/^hidden$/']
  'no LibreOffice association':
    title: '5.1: Files offers no LibreOffice application for Office and OpenDocument files'
    exec: >-
      set -e; command -v gio >/dev/null; out=$(for t in
      application/vnd.openxmlformats-officedocument.wordprocessingml.document
      application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      application/vnd.openxmlformats-officedocument.presentationml.presentation
      application/msword application/vnd.ms-excel application/vnd.ms-powerpoint
      application/vnd.oasis.opendocument.text application/rtf text/csv; do gio mime "$t" 2>&1; done);
      if printf '%s' "$out" | grep -qi libreoffice; then printf '%s\n' "$out"; exit 1; fi; echo none
    exit-status: 0
    stdout: ['/^none$/']
  'no LibreOffice mailcap entry':
    title: '5.1: /etc/mailcap names no LibreOffice command'
    exec: "if grep -qsE 'soffice|libreoffice' /etc/mailcap; then grep -E 'soffice|libreoffice' /etc/mailcap; exit 1; fi; echo none"
    exit-status: 0
    stdout: ['/^none$/']
  'soffice still installed':
    title: '5.1: LibreOffice stays installed for headless conversion (only hidden from the desktop)'
    exec: "test -x /usr/bin/soffice && echo present"
    exit-status: 0
    stdout: ['/^present$/']
  'no thumbnailer registered':
    title: '5.1: no *.thumbnailer file is left where the GNOME thumbnail factory looks'
    exec: "find /usr/share/thumbnailers /usr/local/share/thumbnailers -name '*.thumbnailer' 2>/dev/null; true"
    exit-status: 0
    stdout:
      - '!/\.thumbnailer$/'
  'nautilus thumbnails never':
    title: '5.1: org.gnome.nautilus.preferences show-image-thumbnails is never'
    exec: dconf read /org/gnome/nautilus/preferences/show-image-thumbnails
    exit-status: 0
    stdout: ["/^'never'$/"]
  'thumbnailers disabled':
    title: '5.1: org.gnome.desktop.thumbnailers disable-all is true'
    exec: dconf read /org/gnome/desktop/thumbnailers/disable-all
    exit-status: 0
    stdout: ['/^true$/']
  'thumbnail locks':
    title: '5.1: thumbnail keys are locked'
    exec: dconf list-locks /org/
    exit-status: 0
    stdout:
      - /org/gnome/nautilus/preferences/show-image-thumbnails
      - /org/gnome/desktop/thumbnailers/disable-all
  'indexer indexes nothing':
    title: '5.2: tracker miner settings index nothing and watch nothing'
    exec: >-
      dconf read /org/freedesktop/tracker/miner/files/index-recursive-directories;
      dconf read /org/freedesktop/tracker/miner/files/enable-monitors;
      dconf read /org/freedesktop/tracker/miner/files/index-removable-devices
    exit-status: 0
    stdout:
      - '/^@as \[\]$/'
      - '/^false$/'
      - '!/^true$/'
  'indexer locks':
    title: '5.2: tracker miner keys are locked'
    exec: dconf list-locks /org/freedesktop/tracker/miner/files/
    exit-status: 0
    stdout:
      - /org/freedesktop/tracker/miner/files/index-recursive-directories
      - /org/freedesktop/tracker/miner/files/enable-monitors
  'no indexer process':
    title: '5.2: no tracker-miner-fs or localsearch process runs'
    exec: "pgrep -l -f 'tracker-miner-fs|localsearch' || true"
    exit-status: 0
    stdout:
      - '!/tracker-miner|localsearch/'
  'no volume monitor process':
    title: '5.1: no gvfs volume monitor process runs'
    exec: "pgrep -l -f 'gvfs-[a-z0-9]+-volume-monitor' || true"
    exit-status: 0
    stdout:
      - '!/volume-monitor/'
  'screen lock off':
    title: '5.1, 1.2: screen lock is off (the analyst password is locked, so a lock screen could not be opened)'
    exec: >-
      printf 'lock-enabled=%s\n' "$(dconf read /org/gnome/desktop/screensaver/lock-enabled)";
      printf 'idle-activation-enabled=%s\n' "$(dconf read /org/gnome/desktop/screensaver/idle-activation-enabled)";
      printf 'disable-lock-screen=%s\n' "$(dconf read /org/gnome/desktop/lockdown/disable-lock-screen)";
      printf 'idle-delay=%s\n' "$(dconf read /org/gnome/desktop/session/idle-delay)"
    exit-status: 0
    stdout:
      - '/^lock-enabled=false$/'
      - '/^idle-activation-enabled=false$/'
      - '/^disable-lock-screen=true$/'
      - '/^idle-delay=uint32 0$/'
  'no suspend on idle':
    title: '5.1, 1.2: the PC never suspends on idle, so a long analysis is not cut short'
    exec: >-
      printf 'ac=%s\n' "$(dconf read /org/gnome/settings-daemon/plugins/power/sleep-inactive-ac-type)";
      printf 'battery=%s\n' "$(dconf read /org/gnome/settings-daemon/plugins/power/sleep-inactive-battery-type)"
    exit-status: 0
    stdout:
      - "/^ac='nothing'$/"
      - "/^battery='nothing'$/"
  'screen lock locks':
    title: '5.1, 1.2: screen lock and idle keys are locked'
    exec: dconf list-locks /org/gnome/
    exit-status: 0
    stdout:
      - /org/gnome/desktop/screensaver/lock-enabled
      - /org/gnome/desktop/screensaver/idle-activation-enabled
      - /org/gnome/desktop/screensaver/ubuntu-lock-on-suspend
      - /org/gnome/desktop/lockdown/disable-lock-screen
      - /org/gnome/desktop/session/idle-delay
      - /org/gnome/settings-daemon/plugins/power/sleep-inactive-ac-type
      - /org/gnome/settings-daemon/plugins/power/sleep-inactive-battery-type
      - /org/gnome/settings-daemon/plugins/power/idle-dim
